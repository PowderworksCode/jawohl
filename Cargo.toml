[package]
name = "jawohl"
version = "0.1.1-dev"
edition = "2021"
authors = ["Zack Maril <zack@genau.ai>"]
description = "Complete JSON documents from a stream of JSON tokens"
keywords = []
license = "MIT"
documentation = "https://genau.ai"
homepage = "https://github.com/genauai/jawohl"
repository = "https://github.com/genauai/jawohl"
readme = "README.md"

[dependencies]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
serde_json = "1.0.96"
[features]
default = ["pattern"]
# `pattern` support, via a DFA that can report when a prefix is already dead.
# Disabled builds still compile schemas; they record the pattern as unlowered
# in the report rather than pretending it passed.
pattern = ["dep:regex-automata"]

[dependencies.regex-automata]
version = "0.4"
optional = true
default-features = false
features = ["std", "syntax", "dfa-build", "dfa-search", "unicode"]
