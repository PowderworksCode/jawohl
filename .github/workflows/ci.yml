name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # What a pull request touched decides what the rest of this file runs. On a
  # push there is no base to compare against, so everything counts as changed
  # and main is gated on the whole file exactly as before.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request; everything runs"
            exit 0
          fi
          # Named as what cannot affect a build rather than what can, so a new
          # kind of file is treated as code until someone says otherwise. That
          # matters more here than the saved minutes: README.md is absent from
          # this list because every Rust snippet in it is a doctest, and
          # `cargo package` ships it.
          if git diff --name-only "$BASE"...HEAD \
              | grep -qvE '^(DESIGN|CHANGELOG)\.md$|^images/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "only prose and images changed; the cargo jobs are skipped"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # One string, not a flow mapping: `{ components: rustfmt, clippy }`
          # parses `clippy` as a separate key, and the action silently ignores
          # it -- clippy then only runs because the runner image happens to
          # ship it.
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Doctests include every Rust snippet in the README, so the front page
      # cannot drift from the crate.
      - run: cargo test --all-targets
      - run: cargo test --doc

  # The examples are documentation that has to keep working.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: |
          for ex in complete streaming validate sse; do
            echo "== $ex"
            cargo run --quiet --example "$ex" > /dev/null
          done

  # The declared MSRV has to be real -- for consumers of the library, which is
  # what `rust-version` promises. Dev-dependencies are deliberately not covered:
  # serde_json's tree currently requires 1.71, and that constrains our test
  # suite, not anybody depending on jawohl.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@e09e0d4c1f9d84cdd46855833435a743d2e6b596 # 1.70.0
      # The committed lockfile is v4, which cargo 1.70 cannot parse. Resolving
      # fresh also means this job fails loudly if a dependency raises its own
      # MSRV past ours, which is the signal we want.
      - run: rm -f Cargo.lock
      - run: cargo build

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo package
