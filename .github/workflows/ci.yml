name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # One string, not a flow mapping: `{ components: rustfmt, clippy }`
          # parses `clippy` as a separate key, and the action silently ignores
          # it -- clippy then only runs because the runner image happens to
          # ship it.
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Doctests include every Rust snippet in the README, so the front page
      # cannot drift from the crate.
      - run: cargo test --all-targets
      - run: cargo test --doc

  # The examples are documentation that has to keep working.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for ex in complete streaming validate sse; do
            echo "== $ex"
            cargo run --quiet --example "$ex" > /dev/null
          done

  # The declared MSRV has to be real -- for consumers of the library, which is
  # what `rust-version` promises. Dev-dependencies are deliberately not covered:
  # serde_json's tree currently requires 1.71, and that constrains our test
  # suite, not anybody depending on jawohl.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.70.0
      # The committed lockfile is v4, which cargo 1.70 cannot parse. Resolving
      # fresh also means this job fails loudly if a dependency raises its own
      # MSRV past ours, which is the signal we want.
      - run: rm -f Cargo.lock
      - run: cargo build

  # jawohl through jedem: one annotated surface, two generated bindings, both
  # exercised by a real host process. Separate workspace, so none of this
  # touches the published crate.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cargo install --git https://github.com/PowderworksCode/jedem --branch feat/handles cargo-jedem
      # The drift guard is part of jawohl's own test suite now -- the surface
      # is jawohl's annotations -- so the `test` job above already covers it.
      - run: cargo jedem run --python test.py
        working-directory: bindings
      - run: cargo jedem run --node test.mjs
        working-directory: bindings

  # BLOCKED, deliberately: jawohl now depends on jedem, and jedem is not on
  # crates.io yet, so `cargo package` cannot resolve it and jawohl 0.2.0 cannot
  # be published. Publishing jedem 0.1 unblocks this and nothing else here has
  # to change -- the dependency already carries `version = "0.1"` alongside its
  # git source, which is the form cargo strips to on publish.
  #
  # Reported rather than enforced, so the failure stays visible without turning
  # every pull request red for a reason none of them caused.
  packaging:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package
