[package]
name = "jawohl-node"
description = "The Node binding for jawohl, generated by jedem."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jawohl-surface = { path = "../surface" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
