[package]
name = "jawohl-py"
description = "The Python binding for jawohl, generated by jedem."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "jawohl"
crate-type = ["cdylib"]

[dependencies]
jawohl-surface = { path = "../surface" }
pyo3 = { version = "0.23", features = ["extension-module"] }
